<!-- HTML Template -->
<div style="display: flex; margin-bottom: 16px;">
    <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-left: auto;">

        <!-- Search Input Field -->
        <div style="position: relative; height: 40px;">
            <input type="text" (input)="searchInput.value = searchInput.value.trim()" placeholder="Search" #searchInput
                (keyup)="applySearch(searchInput.value)"
                style="padding: 0 32px 0 12px; height: 40px; width: 200px; border: 1px solid #ccc; border-radius: 6px; outline: none; font-size: 14px;" />
            <mat-icon style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: gray;">
                search
            </mat-icon>
        </div>

        <!-- Add Product Button -->
        <button mat-raised-button color="primary" (click)="onAddProduct()"
            style="border-radius: 6px; padding: 0 16px; height: 40px; line-height: 40px;">
            <mat-icon>add</mat-icon>
            Add Product
        </button>
    </div>
</div>

<div style="margin: 0 16px;">
    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSort($event)"
        class="custom-table mat-elevation-z2" style="width: 100%;">

        <!-- ID Column -->
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="custom-header">ID</th>
            <td mat-cell *matCellDef="let element" class="custom-cell">{{ element.id }}</td>
        </ng-container>

        <!-- Name Column -->
        <!-- Name Column with Kebab Menu -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="custom-header">Name</th>
            <td mat-cell *matCellDef="let element" class="custom-cell"
                style="display: flex; align-items: center; justify-content: space-between;">
                <span>{{ element.name }}</span>

                <!-- Kebab Menu Trigger -->
                <button mat-icon-button [matMenuTriggerFor]="menu" style="margin-left: auto;">
                    <mat-icon>more_vert</mat-icon>
                </button>

                <!-- Kebab Menu -->
                <mat-menu #menu="matMenu">
                    <button mat-menu-item (click)="onDelete(element.id)">
                        <mat-icon>delete</mat-icon>
                        <span>Delete</span>
                    </button>
                    <button mat-menu-item (click)="onEdit(element)">
                        <mat-icon>edit</mat-icon>
                        <span>Edit</span>
                    </button>
                </mat-menu>
            </td>
        </ng-container>


        <!-- Description Column -->
        <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="custom-header">Description</th>
            <td mat-cell *matCellDef="let element" class="custom-cell">{{ element.description }}</td>
        </ng-container>

        <!-- Header and Row Definitions -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="custom-header-row"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="custom-row"></tr>
    </table>

    <!-- Paginator -->
    <mat-paginator [length]="length" [pageSizeOptions]="pageSizeOptions" [pageIndex]="pageIndex" [pageSize]="pageSize"
        showFirstLastButtons class="custom-paginator" (page)="onPageChange($event)"></mat-paginator>
</div>
